name: Valerian
latin: Valeriana officinalis
aliases:
  - All-heal
  - Garden heliotrope
category: root
status: collected
jarColor: "#b7a68a"
origin: Europe and parts of Asia
intendedUse: Falling asleep more easily; calming nervous tension
blurb: >-
  Pretty pink-white flowers above a famously stinky root (cats adore it).
  Valerian is one of the most used herbal

  sleep aids, though trials give mixed results.
evidence: "2"
evidenceSummary: >-
  Dozens of trials and several meta-analyses exist, so it's well studied, but
  results are inconsistent.

  Some show small improvements in subjective sleep quality, while many objective
  sleep studies find no difference from

  placebo. It may work better after a few weeks of nightly use. Valerenic acid
  acts on GABA-A receptors in lab studies.
sources:
  - title: Valerian (NIH National Center for Complementary and Integrative Health)
    url: https://www.nccih.nih.gov/health/valerian
  - title: "Valerian for sleep: a systematic review and meta-analysis (Bent et al.,
      2006, Am J Med)"
    url: https://pubmed.ncbi.nlm.nih.gov/17145239/
  - title: Valerian Root in Treating Sleep Problems and Associated Disorders-A
      Systematic Review and Meta-Analysis (Shinjyo et al., 2020, J Evid Based
      Integr Med)
    url: https://pubmed.ncbi.nlm.nih.gov/33086877/
psychoactive: false
legal: ""
growing:
  zones: 4–9
  sun: Full sun to part shade
  water: Consistently moist
  soil: Rich, moist loam
  propagation: >-
    Sow seed on the surface in spring (needs light) or divide established
    plants. It self-seeds readily and can grow

    5 feet tall.
  harvest: Dig roots in the fall of the second year. Wash thoroughly and dry them
    quickly. The smell gets stronger as they dry.
history: >-
  Hippocrates described valerian, and Galen prescribed it for insomnia in the
  2nd century. In medieval Europe it was

  called "all-heal." During both World Wars it was given to civilians in Britain
  for shell shock and air-raid nerves.
culture: >-
  Valerian was once hung in houses to ward off evil and used as a perfume in the
  16th century, when its smell was

  apparently appreciated. A folk legend says the Pied Piper of Hamelin carried
  valerian root to lure the rats.
preparations:
  - method: Infusion
    notes: Steep 1 tsp dried root in hot water for 10–15 minutes. Mask the smell
      with mint or lemon balm.
  - method: Tincture
    notes: 1–3 mL about 30–60 minutes before bed.
  - method: Extract capsules
    notes: Trials often used 300–600 mg 30 minutes to 2 hours before bed.
risks: >-
  Generally well tolerated. It can cause headache, dizziness, stomach upset, or
  morning grogginess, and sometimes

  stimulates rather than relaxes. It adds to the effect of alcohol and
  sedatives. Rare reports of liver injury exist. Not

  recommended in pregnancy or for young children due to lack of data.
pairsWith:
  - passionflower
  - lemon-balm
  - chamomile
