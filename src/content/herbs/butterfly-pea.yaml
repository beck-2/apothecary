name: Butterfly Pea
latin: Clitoria ternatea
aliases:
  - Blue pea
  - Asian pigeonwings
  - Anchan
category: flower
status: collected
jarColor: "#3d5bb8"
origin: Tropical Asia (often said to be from Southeast Asia or the Indian subcontinent)
intendedUse: A color-changing blue tea and natural food dye; a traditional memory herb
blurb: >-
  Brilliant cobalt flowers that steep into a deep blue tea, which turns
  violet-pink the moment you add lemon. Used in

  Ayurveda as a brain tonic, it's mostly loved today as a magical natural dye.
evidence: "1"
evidenceSummary: >-
  Butterfly pea is rich in stable anthocyanins called ternatins, which give the
  blue color and are

  antioxidant in lab studies. Animal studies suggest memory-enhancing and
  anti-anxiety effects of root extract, and small

  human studies looked at blood sugar after meals. Clinical evidence is very
  limited.
sources:
  - title: Extraction methods of butterfly pea (Clitoria ternatea) flower and
      biological activities of its phytochemicals (Jeyaraj et al., 2021, J Food
      Sci Technol)
    url: https://pubmed.ncbi.nlm.nih.gov/33967304/
  - title: Clitoria ternatea (Wikipedia)
    url: https://en.wikipedia.org/wiki/Clitoria_ternatea
psychoactive: false
legal: ""
growing:
  zones: 10–12 perennial; annual vine elsewhere
  sun: Full sun
  water: Moderate
  soil: Adaptable, well-drained
  propagation: >-
    Nick or soak seeds overnight, then sow in warm soil after the last frost.
    It's a fast-climbing vine that needs a

    trellis. As a legume, it fixes nitrogen.
  harvest: Pick flowers daily in the morning as they open. Dry them in shade to
    keep the color.
history: >-
  In Ayurveda, *shankhpushpi* (a name shared with several plants) and
  *aparajita* are used as memory and nerve

  tonics. The flower has long been used in Southeast Asia to dye food blue.
  Linnaeus gave it a frankly anatomical genus

  name in the 1700s, after the flower's shape.
culture: >-
  In Malaysia, butterfly pea colors the blue rice of *nasi kerabu* and the
  striped *kuih* sweets of Peranakan

  cuisine. In Thailand, *nam dok anchan* is a blue lemonade sold at street
  stalls. In Hindu worship, the flower is

  offered to Durga and Shiva.
preparations:
  - method: Color-changing tea
    notes: Steep 5–8 dried flowers in hot water for 5 minutes, then add lemon or
      lime to watch it turn purple.
  - method: Blue rice
    notes: Cook rice in strained flower tea.
  - method: Cocktails
    notes: Use the tea in gin or tonic for a color-changing drink.
risks: >-
  Generally considered safe as a tea in normal amounts. It may lower blood
  sugar. Insufficient data exist for pregnancy.

  The seeds and roots can be strongly laxative.
pairsWith:
  - lemongrass
  - matcha
  - ginger
  - peppermint
draft: true
